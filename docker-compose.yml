services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: fhir
      POSTGRES_PASSWORD: fhir
      POSTGRES_DB: fhir
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fhir"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
